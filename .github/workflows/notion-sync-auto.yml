name: Notion Sync Auto Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  notion-sync-auto:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger auto notion sync check
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          NOTION_SYNC_RUN_TOKEN: ${{ secrets.NOTION_SYNC_RUN_TOKEN }}
        run: |
          test -n "$SITE_BASE_URL"
          test -n "$NOTION_SYNC_RUN_TOKEN"
          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${NOTION_SYNC_RUN_TOKEN}" \
            -d '{"source":"auto"}' \
            "${SITE_BASE_URL%/}/api/notion-sync/run"
