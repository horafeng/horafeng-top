<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>留言板 | HoraFeng</title>
    <link rel="stylesheet" href="assets/css/diary.css" />
  </head>
  <body data-page="guestbook">
    <div class="bg-layer"></div>

    <div id="splash-screen" class="splash-screen" aria-hidden="true">
      <span class="splash-logo">HoraFeng</span>
    </div>

    <header class="site-nav" data-site-nav data-search-target="#guestbook-content">
      <div class="site-nav-inner">
        <a class="site-nav-left" href="index.html">HoraFeng的博客</a>

        <nav class="site-nav-center" aria-label="主导航">
          <a class="site-nav-link" href="index.html">首页</a>
          <div class="site-nav-dropdown" data-nav-dropdown>
            <button class="site-nav-link site-nav-dropdown-toggle" type="button" data-nav-dropdown-toggle>
              内容
              <span class="site-nav-caret" aria-hidden="true">▾</span>
            </button>
            <div class="site-nav-dropdown-menu">
              <a href="index.html?content=article">文章</a>
              <a href="index.html?content=note">小记</a>
              <a href="index.html?content=notice">公告</a>
            </div>
          </div>
        </nav>

        <button class="site-nav-search" type="button" aria-label="搜索" data-nav-search>⌕</button>
        <button class="site-nav-brand-mini" type="button" data-nav-brand-center>HoraFeng</button>
        <button class="site-nav-backtop" type="button" data-nav-backtop>返回顶部 ↑</button>
      </div>
    </header>

    <div class="app-shell guestbook-shell">
      <aside id="guestbook-profile-panel" class="panel profile-panel guestbook-profile-panel">
        <div class="profile-cover" id="guestbook-profile-cover"></div>
        <div class="profile-main">
          <img id="guestbook-profile-avatar" class="profile-avatar" src="assets/images/Profile.png" alt="博主头像" />
          <h1 id="guestbook-profile-name">HoraFeng</h1>
          <p id="guestbook-profile-handle" class="profile-handle">@horafeng</p>
          <p id="guestbook-profile-signature" class="subtle">把普通日子写成会发光的碎片。</p>
          <p id="guestbook-profile-bio" class="subtle">这里是我的轻日记与生活记事。</p>
          <p id="guestbook-profile-last-seen" class="last-seen subtle">博主最近来过</p>
        </div>
        <div class="profile-actions">
          <a id="guestbook-email-button" class="profile-action-btn" href="mailto:horafeng@outlook.com">发送邮件</a>
        </div>
        <nav class="soft-nav">
          <a href="index.html">日记流</a>
          <a class="active" href="guestbook.html">留言板</a>
        </nav>
      </aside>

      <main class="panel flow-panel guestbook-flow-panel">
        <header class="guestbook-hero">
          <nav class="breadcrumb">
            <a href="index.html">日记流</a>
            <span>/</span>
            <span>留言板</span>
          </nav>
          <p class="guestbook-kicker">Message Board</p>
          <h1>留言板</h1>
          <p class="guestbook-lead">
            这是站内独立的长页面，不是弹层。欢迎留下来访痕迹，也欢迎聊聊最近在读的书、走过的路，或者某个普通却发光的瞬间。
          </p>
          <p class="guestbook-note subtle">公开展示昵称、留言内容、时间与回复关系；联系方式仅博主在后台可见。</p>
        </header>

        <section id="guestbook-form-wrap" class="panel-lite guestbook-form-wrap">
          <button
            id="guestbook-form-toggle"
            class="guestbook-form-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="guestbook-form-collapsible"
          >
            <span class="guestbook-form-toggle-text">写一条留言吧</span>
            <span class="guestbook-form-toggle-arrow" aria-hidden="true"></span>
          </button>
          <p id="guestbook-form-toggle-tip" class="subtle guestbook-form-toggle-tip"></p>

          <div id="guestbook-form-collapsible" class="guestbook-form-collapsible" aria-hidden="true">
            <div class="guestbook-form-collapsible-inner">
              <form id="guestbook-form" class="guestbook-form" novalidate>
                <input id="guestbook-page-key" type="hidden" value="guestbook" />
                <input id="guestbook-parent-id" type="hidden" value="" />

                <div id="guestbook-replying" class="replying-hint" hidden></div>

                <label class="field-block" for="guestbook-content">留言内容</label>
                <textarea id="guestbook-content" rows="6" maxlength="2000" placeholder="写点什么吧..." required></textarea>

                <div class="field-grid">
                  <div>
                    <label class="field-block" for="guestbook-nickname">昵称</label>
                    <input id="guestbook-nickname" type="text" maxlength="24" placeholder="例如：木木" required />
                  </div>
                  <div>
                    <label class="field-block" for="guestbook-contact">联系方式（邮箱或 QQ）</label>
                    <input id="guestbook-contact" type="text" maxlength="120" placeholder="name@example.com 或 12345678" required />
                  </div>
                </div>

                <label class="notify-option" for="guestbook-notify">
                  <input id="guestbook-notify" type="checkbox" checked />
                  <span>收到回复时，通过邮件提醒我（可随时退订）</span>
                </label>

                <div id="turnstile-slot" class="turnstile-slot">
                  <div id="turnstile-widget"></div>
                  <p id="turnstile-hint" class="subtle"></p>
                </div>

                <div class="guestbook-submit-row">
                  <button id="guestbook-submit" type="submit">发送留言</button>
                  <p id="guestbook-feedback" class="subtle"></p>
                </div>
              </form>
            </div>
          </div>
        </section>

        <section class="guestbook-list-wrap">
          <div class="guestbook-list-head">
            <h2>最新留言</h2>
            <p class="subtle">按时间倒序展示，支持访客互相回复与博主回复。</p>
          </div>
          <div id="guestbook-list" class="guestbook-list"></div>
        </section>
      </main>
    </div>

    <div id="guestbook-toast" class="guestbook-toast" role="status" aria-live="polite" hidden>
      <span class="guestbook-toast-check" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M5 12.5L10 17L19 7.5"></path>
        </svg>
      </span>
      <span id="guestbook-toast-text">成功留言！审核通过后会展示在留言区。</span>
    </div>

    <script type="module" src="assets/js/guestbook.js"></script>
  </body>
</html>
