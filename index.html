<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日记流 | HoraFeng</title>
    <link rel="stylesheet" href="assets/css/diary.css" />
  </head>
  <body data-page="home">
    <div class="bg-layer"></div>
    <div id="splash-screen" class="splash-screen" aria-hidden="true">
      <span class="splash-logo">HoraFeng</span>
    </div>

    <div class="app-shell home-shell">
      <div class="mobile-stage-controls">
        <button type="button" data-pane-target="left">资料</button>
        <button type="button" data-pane-target="center" class="active">日记</button>
        <button type="button" data-pane-target="right">功能</button>
      </div>

      <div class="home-stage" id="home-stage" data-pane="center">
        <aside class="panel profile-panel home-pane home-pane-left">
          <div class="profile-main">
            <img id="profile-avatar" class="profile-avatar" src="https://dummyimage.com/96x96/f3f5f8/8a94a6&text=HF" alt="博主头像" />
            <h1 id="profile-name">HoraFeng</h1>
            <p id="profile-signature" class="subtle">把普通日子写成会发光的碎片。</p>
            <p id="profile-last-seen" class="last-seen subtle">博主最近来过</p>
          </div>
          <div class="profile-actions">
            <a id="email-button" class="profile-action-btn" href="mailto:hello@example.com">发送邮件</a>
            <a id="im-button" class="profile-action-btn ghost" href="#" target="_blank" rel="noopener noreferrer">即时消息</a>
          </div>
          <nav class="soft-nav">
            <a class="active" href="index.html">日记流</a>
            <a href="tags.html">标签 / 归档</a>
          </nav>
        </aside>

        <main class="panel flow-panel home-pane home-pane-center">
          <header class="section-head">
            <h2 id="timeline-heading">最近日记</h2>
            <p class="subtle">只收录文字、emoji 与网页链接</p>
          </header>

          <form id="search-form" class="search-bar" role="search">
            <input id="search-input" type="search" placeholder="搜索标题、正文或标签..." aria-label="搜索日记" />
            <button type="submit">搜索</button>
          </form>
          <p id="search-hint" class="search-hint subtle"></p>

          <div id="timeline" class="timeline"></div>
        </main>

        <aside class="panel side-panel home-pane home-pane-right">
          <section>
            <h3>标签预览</h3>
            <div id="tag-preview" class="chips"></div>
          </section>
          <section>
            <h3>归档预览</h3>
            <ul id="archive-preview" class="archive-list"></ul>
          </section>
          <section>
            <h3>近期评论</h3>
            <ul id="recent-comments" class="comment-list">
              <li class="subtle">正在加载评论...</li>
            </ul>
          </section>
        </aside>
      </div>
    </div>

    <script type="module" src="assets/js/index.js"></script>
  </body>
  </html>
